[project]
name = "market-1t"
version = "0.1.0"
description = "Regularly sampled (e.g. 1 Hz) US equity market snapshots built from Massive (formerly Polygon.io) flat files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
keywords = ["market data", "equities", "nbbo", "trades", "quotes", "massive", "polygon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]
# Exact versions are pinned in uv.lock (numpy 1.26.4, pandas 2.2.2, polars 1.6.0,
# pyarrow 17.0.0): the versions the outputs were validated with, installed by
# `uv sync`.  The ranges below are the compatible ones.
dependencies = [
    "boto3>=1.34",
    "isal>=1.6",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    # Tickers are assigned to partitions with Polars' hash, which changed in
    # 1.26 (checked on all 12,882 tickers of a 2026 day).
    "polars>=1.6,<1.26",
    "pyarrow>=17",
    "pytz>=2024.1",
    "tqdm>=4.66",
]

[project.scripts]
market-1t = "market_1t.cli:main"

[project.urls]
Repository = "https://github.com/fin-ai-lab/market-1t"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py310"
# The original implementation the tests compare against, left as written.
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
